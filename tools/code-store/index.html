<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>

<!-- LIST VIEW: all snippets -->
<div id="list-view" style="display:none;">
  <header id="list-header">
    <div>
      <a href="../../index.html" class="link-btn">&larr; Tools Menu</a>
      <h1>Code Store</h1>
      <p class="sub">Paste code, preview it with syntax highlighting, and save it as a snippet.</p>
    </div>
    <div class="header-actions">
      <button id="new-snippet-btn" class="btn btn-primary">+ New Snippet</button>
    </div>
  </header>
  <div id="snippet-grid"></div>
  <div id="list-empty" class="empty-state" style="display:none;">
    No snippets yet. Click "+ New Snippet" to add the first one.
  </div>
</div>

<!-- DETAIL VIEW: one snippet -->
<div id="detail-view" style="display:none;">
  <header id="detail-header">
    <button id="back-btn" class="link-btn">&larr; All Snippets</button>
    <div id="detail-title-row">
      <h1 id="snippet-name">Loading&hellip;</h1>
      <div class="header-actions">
        <button id="copy-btn" class="btn btn-sm">Copy</button>
        <button id="edit-btn" class="btn btn-sm">Edit</button>
        <button id="delete-btn" class="btn btn-sm btn-danger">Delete</button>
      </div>
    </div>
  </header>

  <pre id="code-view"><code id="code-view-inner"></code></pre>

  <div id="edit-view" style="display:none;">
    <div class="field"><label>Filename</label><input type="text" id="edit-filename" placeholder="e.g. helper.js"></div>
    <div class="field"><label>Code</label><textarea id="edit-code" class="code-input" spellcheck="false"></textarea></div>
    <div class="form-actions">
      <button class="btn" id="edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="edit-save">Save</button>
    </div>
  </div>
</div>

<!-- Generic modal -->
<div id="modal-overlay" style="display:none;">
  <div id="modal-box"></div>
</div>

<div id="toast" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="../../config.js"></script>
<script src="app.js"></script>
</body>
</html>
