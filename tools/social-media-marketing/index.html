<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Media Marketing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LIST VIEW: all posts -->
<div id="list-view" style="display:none;">
  <header id="list-header">
    <div>
      <a href="../../index.html" class="link-btn">&larr; Tools Menu</a>
      <h1>Social Media Marketing</h1>
      <p class="sub">Draft posts, preview and share them, then track impressions and clicks after they go live.</p>
    </div>
    <div class="header-actions">
      <button id="export-btn" class="btn">Download Excel</button>
      <button id="new-post-btn" class="btn btn-primary">+ New Post</button>
    </div>
  </header>

  <div id="summary-row"></div>

  <div id="filter-row">
    <select id="filter-platform"><option value="">All platforms</option></select>
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="draft">Draft</option>
      <option value="scheduled">Scheduled</option>
      <option value="posted">Posted</option>
    </select>
  </div>

  <div id="post-table-wrap">
    <table id="post-table">
      <thead>
        <tr>
          <th></th>
          <th>Post</th>
          <th>Platform</th>
          <th>Status</th>
          <th>Posted</th>
          <th class="num">Impressions</th>
          <th class="num">Clicks</th>
          <th class="num">CTR</th>
          <th>Share</th>
        </tr>
      </thead>
      <tbody id="post-rows"></tbody>
    </table>
  </div>
  <div id="list-empty" class="empty-state" style="display:none;">
    No posts yet. Click "+ New Post" to add the first one.
  </div>
</div>

<!-- DETAIL VIEW: one post -->
<div id="detail-view" style="display:none;">
  <header id="detail-header">
    <button id="back-btn" class="link-btn">&larr; All Posts</button>
    <div id="detail-title-row">
      <h1 id="post-title">Loading&hellip;</h1>
      <div class="header-actions owner-controls">
        <button id="share-btn" class="btn btn-sm">Share</button>
        <button id="edit-btn" class="btn btn-sm">Edit</button>
        <button id="delete-btn" class="btn btn-sm btn-danger">Delete</button>
      </div>
    </div>
  </header>

  <div id="detail-grid">
    <!-- Preview: how the post will look in a feed -->
    <section>
      <div class="section-label">Preview</div>
      <div id="post-preview"></div>
    </section>

    <section>
      <div class="section-label">Details</div>
      <dl id="post-details"></dl>

      <div class="owner-controls" id="media-controls">
        <label class="btn btn-sm" for="media-input" id="media-btn">+ Add image or video</label>
        <input type="file" id="media-input" accept="image/*,video/*" style="display:none;">
        <button id="media-remove-btn" class="btn btn-sm btn-danger" style="display:none;">Remove media</button>
      </div>

      <div id="metrics-head">
        <div class="section-label">Performance</div>
        <button id="add-metrics-btn" class="btn btn-sm btn-primary owner-controls">+ Log Metrics</button>
      </div>
      <div id="metrics-latest"></div>
      <div id="metrics-wrap"></div>
    </section>
  </div>
</div>

<!-- Generic modal -->
<div id="modal-overlay" style="display:none;">
  <div id="modal-box"></div>
</div>

<div id="toast" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../../config.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
