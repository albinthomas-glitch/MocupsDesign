<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Widget Scenario Specs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LIST VIEW: all projects -->
<div id="list-view" style="display:none;">
  <header id="list-header">
    <div>
      <h1>Widget Scenario Specs</h1>
      <p class="sub">Pick a project, or start a new one.</p>
    </div>
    <div class="header-actions">
      <button id="new-project-btn" class="btn btn-primary">+ New Project</button>
    </div>
  </header>
  <div id="project-grid"></div>
  <div id="list-empty" class="empty-state" style="display:none;">
    No projects yet. Click "+ New Project" to create the first one.
  </div>
</div>

<!-- DETAIL VIEW: one project -->
<div id="detail-view" style="display:none;">
  <div id="sidebar">
    <button id="back-btn" class="link-btn">&larr; All Projects</button>
    <div id="sidebar-header">
      <h1 id="widget-name">Loading&hellip;</h1>
      <p id="widget-desc"></p>
      <button id="pdf-btn" class="btn btn-sm">Download PDF</button>
      <div id="owner-controls" class="owner-controls">
        <button id="share-btn" class="btn btn-sm">Share</button>
        <button id="edit-project-btn" class="btn btn-sm">Edit</button>
        <button id="delete-project-btn" class="btn btn-sm btn-danger">Delete</button>
      </div>
    </div>
    <div id="cat-list"></div>
    <div id="owner-controls-2" class="owner-controls">
      <button id="add-category-btn" class="link-btn add-btn">+ Add Category</button>
    </div>
  </div>

  <div id="main">
    <div id="placement-bar" style="display:none;"></div>
    <div id="detail"></div>
  </div>
</div>

<!-- Generic modal -->
<div id="modal-overlay" style="display:none;">
  <div id="modal-box"></div>
</div>

<div id="toast" style="display:none;"></div>

<!-- Built at export time, only shown while printing -->
<div id="print-area"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
