<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<!-- LOGIN VIEW -->
<div id="login-view" class="login-view" style="display:none;">
  <div class="login-box">
    <h1>Tools</h1>
    <p class="sub">Enter the shared password to continue.</p>
    <div class="field">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    </div>
    <button id="login-btn" class="btn btn-primary" style="width:100%;">Log In</button>
    <p id="login-error" class="login-error" style="display:none;"></p>
  </div>
</div>

<!-- MENU VIEW -->
<div id="menu-view" style="display:none;">
  <header id="menu-header">
    <div>
      <h1>Tools</h1>
      <p class="sub">Pick a tool to open it.</p>
    </div>
    <div class="header-actions">
      <button id="logout-btn" class="btn btn-sm">Log out</button>
      <button id="add-tool-btn" class="btn btn-primary">+ Add Tool</button>
    </div>
  </header>
  <div id="tool-grid"></div>
</div>

<!-- Generic modal -->
<div id="modal-overlay" style="display:none;">
  <div id="modal-box"></div>
</div>

<div id="toast" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="portal.js"></script>
</body>
</html>
